<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enquiry Form</title>
</head>
<body>
    <h1>Enquiry Form</h1>
    <p>If you are interested in adopting an animal, please fill out the enquiry form below. We will get back to you as soon as possible.</p>
    <form name="enquiryForm" id="enquiryForm" method="post" action="/submit">
        autocomplete="on"
        <fieldset>
            <legend>Enquiry Information</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>
            

            <!--Field for dropdown to select animal type-->
            <label for="animalType">Animal Type:</label>
            <select id="animalType" name="animalType">
                <option value="dog">Dog</option>
                <option value="cat">Cat</option>
            </select><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" required maxlength="500"></textarea><br   ><br>
        </fieldset>
    </form>
</body>
</html>
